plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}

version = mod_version
group = mod_group_id
base { archivesName = mod_id }
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

repositories {
    maven { url = 'https://maven.blamejared.com' }
}

configurations {
    localRuntime
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
    // Present in development clients; never bundled or required on dedicated servers.
    if (!providers.gradleProperty('withoutJei').isPresent()) {
        localRuntime "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"
    }
}

sourceSets {
    gameTest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

neoForge {
    version = project.neo_version
    addModdingDependenciesTo sourceSets.gameTest
    runs {
        client { client() }
        server { server(); programArgument '--nogui' }
        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        configureEach { logLevel = org.slf4j.event.Level.INFO }
    }
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
            if (providers.gradleProperty('gameTests').isPresent()) sourceSet sourceSets.gameTest
        }
    }
}

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
        neo_version: neo_version, mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.named('check') { dependsOn tasks.named('gameTestClasses') }
idea { module { downloadSources = true; downloadJavadoc = true } }
